    <link rel="stylesheet" href="style.css">
    <title>Blob</title>
</head>
<body>
    <div>
        <canvas id="blob"></canvas>
    </div>

    <div id="warning">
        <div class="child">
            <h1 class="warningh1">Warning</h1>

            <p class="warningp2">This blob does not respond to you it just interact with the intensity of the sound</p>
        </div>
        <div class="child2">
            <button id="show-button">Ok</button>
        </div>
    </div>
    <script type="importmap">
    {
